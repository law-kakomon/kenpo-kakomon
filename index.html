<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --fg:#1f2328; --muted:#6b7280; --border:#e2e0da;
  --accent:#4a5fa5; --accent-weak:#eef1f9; --mark:#fde68a;
  --old:#8a6d3b; --old-bg:#fdf3df;
  --shadow:0 8px 24px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171b; --panel:#1d2026; --fg:#e6e4df; --muted:#9aa0a8; --border:#33373f;
    --accent:#8ea2d8; --accent-weak:#262c3a; --mark:#7a5d00;
    --old:#d9bd84; --old-bg:#3a3118;
    --shadow:0 8px 24px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
  display:flex; flex-direction:column; overflow:hidden; font-size:14px;
}
button,input,select{font-family:inherit; color:inherit; font-size:inherit}

/* ---------- header ---------- */
header{
  flex:0 0 auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:8px 14px; border-bottom:1px solid var(--border); background:var(--panel);
}
#brand{font-weight:700; font-size:15px; letter-spacing:.05em; white-space:nowrap}
#brand small{font-weight:400; color:var(--muted); margin-left:7px; font-size:11px; letter-spacing:0}
.chips{display:flex; gap:4px; flex-wrap:wrap}
.chips button{
  border:1px solid var(--border); background:transparent; border-radius:7px;
  padding:4px 11px; cursor:pointer; line-height:1.5;
}
.chips button:hover{background:var(--accent-weak)}
.chips button.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
#q{
  border:1px solid var(--border); background:var(--bg); border-radius:7px;
  padding:5px 10px; width:220px; min-width:120px;
}
#q:focus{outline:2px solid var(--accent-weak); border-color:var(--accent)}
.spacer{flex:1}
#count{color:var(--muted); font-size:12px; white-space:nowrap}
#aboutBtn{border:1px solid var(--border); background:transparent; border-radius:7px;
          padding:4px 11px; cursor:pointer; color:var(--muted); white-space:nowrap}
#aboutBtn:hover{background:var(--accent-weak); color:var(--fg)}

/* ---------- layout ---------- */
main{flex:1 1 auto; display:flex; min-height:0}
#units{
  flex:0 0 232px; overflow-y:auto; border-right:1px solid var(--border);
  background:var(--panel); padding:10px 0 40px;
}
#list{
  flex:0 0 330px; overflow-y:auto; border-right:1px solid var(--border);
  padding:8px 10px 40px;
}
#detail{flex:1 1 auto; overflow-y:auto; background:var(--panel); padding:16px 20px 40px; min-width:0}

/* ---------- 単元ツリー ---------- */
.grp{margin:0 0 4px}
.grp>h3{
  margin:10px 12px 4px; font-size:11px; font-weight:700; color:var(--muted);
  letter-spacing:.08em;
}
.unit{
  display:flex; align-items:baseline; gap:6px; width:100%; text-align:left;
  border:0; background:transparent; padding:5px 12px 5px 16px; cursor:pointer;
  border-radius:0; line-height:1.4;
}
.unit:hover{background:var(--accent-weak)}
.unit.on{background:var(--accent); color:#fff; font-weight:600}
.unit .n{margin-left:auto; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.unit.on .n{color:#fff; opacity:.85}
.unit.zero{opacity:.4}
.unit.top{font-weight:600; padding-left:12px}

/* ---------- 一覧 ---------- */
.card{
  border:1px solid var(--border); background:var(--panel); border-radius:9px;
  padding:9px 11px; margin-bottom:7px; cursor:pointer;
}
.card:hover{border-color:var(--accent)}
.card.on{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}
.card .ttl{font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.card .tp{color:var(--muted); font-size:12px; margin-top:3px; line-height:1.5}
.badge{
  font-size:10px; font-weight:600; border-radius:4px; padding:1px 5px;
  border:1px solid var(--border); color:var(--muted); letter-spacing:.02em;
}
.badge.old{background:var(--old-bg); color:var(--old); border-color:transparent}
.badge.done{background:var(--accent-weak); color:var(--accent); border-color:transparent}
.badge.uncls{background:transparent}
.empty{color:var(--muted); padding:20px 4px; line-height:1.8}
.about{max-width:48em; line-height:1.85}
.about p{margin:0 0 10px}
.about code{background:var(--accent-weak); border-radius:4px; padding:1px 5px; font-size:12.5px}

/* ---------- 詳細 ---------- */
#detail h2{margin:0 0 2px; font-size:20px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
#detail .meta{color:var(--muted); font-size:12.5px; margin-bottom:14px}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center}
.btn{
  border:1px solid var(--border); background:var(--bg); border-radius:8px;
  padding:7px 14px; cursor:pointer; text-decoration:none; color:inherit;
  display:inline-flex; align-items:center; gap:5px; line-height:1.4;
}
.btn:hover{background:var(--accent-weak); border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.btn.primary:hover{opacity:.9}
.btn[aria-disabled="true"]{opacity:.4; pointer-events:none}
section.blk{margin:0 0 16px}
section.blk h4{
  margin:0 0 6px; font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.08em;
}
ul.topics{margin:0; padding-left:1.2em; line-height:1.9}
.tagrow{display:flex; gap:5px; flex-wrap:wrap}
.tag{
  border:1px solid var(--border); border-radius:999px; padding:2px 10px; font-size:12px;
  background:transparent; cursor:pointer; line-height:1.6;
}
.tag:hover{background:var(--accent-weak); border-color:var(--accent)}
.tag.plain{cursor:default}
.tag.plain:hover{background:transparent; border-color:var(--border)}
.note{
  color:var(--muted); font-size:12.5px; line-height:1.7;
  border-left:3px solid var(--border); padding:2px 0 2px 10px; margin:10px 0;
}
#viewer{
  width:100%; height:min(78vh,900px); border:1px solid var(--border); border-radius:9px;
  background:var(--bg);
}
#tabsPdf{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px}
label.done{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer; color:var(--muted);
  margin-left:auto; white-space:nowrap;
}
.backbtn{display:none}

/* ---------- 狭い画面 ---------- */
@media (max-width:980px){
  #units{flex:0 0 190px}
  #list{flex:0 0 250px}
}
@media (max-width:760px){
  main{position:relative}
  #units{position:absolute; inset:0 auto 0 0; width:78%; max-width:300px; z-index:3;
         box-shadow:var(--shadow); transform:translateX(-102%); transition:transform .18s}
  body.nav #units{transform:none}
  #list{flex:1 1 auto; border-right:0}
  #detail{position:absolute; inset:0; z-index:2; transform:translateX(102%); transition:transform .18s}
  body.open #detail{transform:none}
  .backbtn{display:inline-flex}
  #navbtn{display:inline-flex !important}
  #viewer{height:70vh}
}
#navbtn{display:none; border:1px solid var(--border); background:transparent;
        border-radius:7px; padding:4px 10px; cursor:pointer}
#scrim{display:none; position:absolute; inset:0; background:rgba(0,0,0,.3); z-index:2}
body.nav #scrim{display:block}
</style>
</head>

  <div id="count"></div>
</header>

<main>
  <nav id="units"></nav>
  <div id="list"></div>
  <article id="detail"></article>
  <div id="scrim"></div>
</main>

:"解説","embed":{"mondai":true,"kaisetsu":false,"kaitou":false},"embedWhy":{"mondai":null,"kaisetsu":null,"kaitou":null},"basis":"問題","units":[],"topics":[],"articles":[],"hanrei":[],"classified":false}]}</script>
<script>
(function(){
"use strict";

const UNIV_PAGE = {
  "同志社":"https://law-school.doshisha.ac.jp/entrance_ex/question/",
  "立命館":"https://www.ritsumei.ac.jp/lawschool/admission/past.html/",
  "関学":"https://www.kwansei.ac.jp/lawschool/admissions/kakomon/",
  "慶應":"https://www.ls.keio.ac.jp/nyushi/examination.html",
  "中央":"https://www.chuo-u.ac.jp/academics/pro_graduateschool/law/orientation/selection/past/"
};
const UNIV_FULL = {
  "同志社":"同志社大学法科大学院",
  "立命館":"立命館大学法科大学院",
  "関学":"関西学院大学法科大学院",
  "慶應":"慶應義塾大学法科大学院",
  "中央":"中央大学法科大学院"
};
const UNIV_LIST = ["同志社","立命館","関学","慶應","中央"];
const LS = "kenpo-kakomon:v1";
const ROPPO = "https://natsunooda.github.io/roppo-viewer/#kenpo/";   // 六法ビューア（同じ作者の別アプリ）

let DATA = {items:[], taxonomy:[]};
let state = {unit:null, univ:new Set(), q:"", sel:null, pdf:"mondai"};
let done = {};

/* ---------- 保存（この端末のブラウザにだけ残る） ---------- */
function loadStore(){
  try{
    const s = JSON.parse(localStorage.getItem(LS) || "{}");
    done = s.done || {};
    if(s.unit !== undefined) state.unit = s.unit;
    if(Array.isArray(s.univ)) state.univ = new Set(s.univ);
  }catch(e){ done = {}; }
}
function saveStore(){
  try{
    localStorage.setItem(LS, JSON.stringify({
      done, unit:state.unit, univ:[...state.univ]
    }));
  }catch(e){}
}

/* ---------- 絞り込み ---------- */
function matches(it){
  if(state.univ.size && !state.univ.has(it.univ)) return false;
  if(state.unit === "__uncls__"){ if(it.classified) return false; }
  else if(state.unit){
    const hit = it.units.some(u => u === state.unit || u.split("/")[0] === state.unit);
    if(!hit) return false;
  }
  const q = state.q.trim();
  if(q){
    const num = /^\d{1,4}$/.test(q);
    const hay = [it.univ, UNIV_FULL[it.univ], it.year + "年度", it.term, it.course,
                 ...it.units, ...it.topics, ...it.hanrei].join(" ");
    if(num){
      if(!it.articles.includes(+q) && hay.indexOf(q) < 0) return false;
    }else if(hay.indexOf(q) < 0) return false;
  }
  return true;
}
const filtered = () => DATA.items.filter(matches);

/* ---------- 単元ツリー ---------- */
function renderUnits(){
  const nav = document.getElementById("units");
  const vis = DATA.items.filter(it => {
    if(state.univ.size && !state.univ.has(it.univ)) return false;
    return true;
  });
  const cnt = {};
  let uncls = 0;
  for(const it of vis){
    if(!it.classified){ uncls++; continue; }
    for(const u of it.units){
      cnt[u] = (cnt[u]||0)+1;
      const t = u.split("/")[0];
      cnt[t] = (cnt[t]||0)+1;
    }
  }
  const parts = [];
  parts.push(btnHTML(null, "すべての単元", vis.length, state.unit===null, "top"));
  for(const g of DATA.taxonomy){
    const n = cnt[g.name]||0;
    parts.push('<div class="grp">');
    if(g.subs.length){
      parts.push('<h3>'+esc(g.name)+'</h3>');
      for(const s of g.subs){
        parts.push(btnHTML(s.key, s.name, cnt[s.key]||0, state.unit===s.key, ""));
      }
    }else{
      parts.push(btnHTML(g.name, g.name, n, state.unit===g.name, "top"));
    }
    parts.push('</div>');
  }
  if(uncls){
    parts.push('<div class="grp"><h3>そのほか</h3>');
    parts.push(btnHTML("__uncls__", "単元未判定", uncls, state.unit==="__uncls__", ""));
    parts.push('</div>');
  }
  nav.innerHTML = parts.join("");
  nav.querySelectorAll(".unit").forEach(b => b.onclick = () => {
    state.unit = b.dataset.u === "" ? null : b.dataset.u;
    document.body.classList.remove("nav");
    saveStore(); renderUnits(); renderList();
  });
}
function btnHTML(key, label, n, on, cls){
  return '<button class="unit '+cls+(on?" on":"")+(n?"":" zero")+'" data-u="'+esc(key===null?"":key)+'">'
       + '<span>'+esc(label)+'</span><span class="n">'+n+'</span></button>';
}

/* ---------- 一覧 ---------- */
function renderList(){
  const box = document.getElementById("list");
  const items = filtered();
  document.getElementById("count").textContent = items.length + " 件 / 全 " + DATA.items.length + " 件";
  if(!items.length){
    box.innerHTML = '<p class="empty">該当する過去問がありません。<br>絞り込みや検索語を見直してください。</p>';
    return;
  }
  box.innerHTML = items.map(it => {
    const tp = it.classified ? it.topics.slice(0,3).join("／") : "解説が公開されていないため単元未判定";
    return '<div class="card'+(state.sel===it.id?" on":"")+'" data-id="'+it.id+'">'
      + '<div class="ttl">'+esc(it.univ)+' '+it.year+'年度 '+esc(it.term)
      + (done[it.id]?' <span class="badge done">解いた</span>':'')
      + '</div><div class="tp">'+esc(tp)+'</div></div>';
  }).join("");
  box.querySelectorAll(".card").forEach(c => c.onclick = () => select(c.dataset.id));
}

/* ---------- 詳細 ---------- */
function select(id){
  state.sel = id; state.pdf = "mondai";
  document.body.classList.add("open");
  renderList(); renderDetail();
  document.getElementById("detail").scrollTop = 0;
}
function renderDetail(){
  const box = document.getElementById("detail");
  const it = DATA.items.find(x => x.id === state.sel);
  if(!it){
    box.innerHTML = aboutHTML();
    const b = document.getElementById("back");
    if(b) b.onclick = () => document.body.classList.remove("open");
    return;
  }
  const kaisetsuLabel = it.kaisetsuLabel || "解説";
  const p = [];
  p.push('<div class="row"><button class="btn backbtn" id="back">← 一覧</button>'
    + '<label class="done"><input type="checkbox" id="doneChk"'+(done[it.id]?" checked":"")+'> 解いた</label></div>');
  p.push('<h2>'+esc(it.univ)+' '+it.year+'年度 '+esc(it.term)
    + '</h2>');
  p.push('<div class="meta">'+esc(UNIV_FULL[it.univ])+'・'+esc(it.course)
    + ' ／ <a href="'+esc(UNIV_PAGE[it.univ])+'" target="_blank" rel="noopener">大学の公開ページ</a></div>');

  // 開くボタン
  p.push('<div class="row">');
  if(it.combined){
    p.push(link(it.mondai, "問題・解説を開く", true));
  }else{
    p.push(link(it.mondai, "問題を開く", true));
    p.push(link(it.kaisetsu, kaisetsuLabel + "を開く", false));
  }
  if(it.kaitou) p.push(link(it.kaitou, "解答用紙", false));
  p.push('</div>');

  if(it.combined){
    p.push('<p class="note">この PDF には、問題と解説（解答例・出題の意図・講評）の両方が入っています。</p>');
  }else if(it.mondaiNote){
    p.push('<p class="note">問題 PDF は'+esc(it.mondaiNote)+'。</p>');
  }
  if(it.kaisetsu && it.kaisetsuNote) p.push('<p class="note">'+esc(kaisetsuLabel)+' PDF は'+esc(it.kaisetsuNote)+'。</p>');
  if(!it.kaisetsu && !it.combined) p.push('<p class="note">この回は'+esc(kaisetsuLabel)+'が公開されていません。</p>');

  if(it.classified){
    p.push('<section class="blk"><h4>単元</h4><div class="tagrow">'
      + it.units.map(u => '<button class="tag" data-u="'+esc(u)+'">'+esc(u.replace("/","／"))+'</button>').join("")
      + '</div></section>');
    p.push('<section class="blk"><h4>論点</h4><ul class="topics">'
      + it.topics.map(t => '<li>'+esc(t)+'</li>').join("") + '</ul></section>');
    if(it.articles.length){
      p.push('<section class="blk"><h4>引用条文（憲法）</h4><div class="tagrow">'
        + it.articles.map(a => '<a class="tag" target="_blank" rel="noopener" href="'
            + ROPPO + encodeURIComponent(String(a)) + '" title="六法ビューアで憲法'+a+'条を開く">'
            + a + '条 ↗</a>').join("")
        + '</div><p class="note">条文をおすと六法ビューアで本文が読めます。'
        + '上の検索欄に条文番号を入れると、その条文が出た回だけが並びます。</p></section>');
    }
    if(it.hanrei.length){
      p.push('<section class="blk"><h4>解説が挙げる判例</h4><div class="tagrow">'
        + it.hanrei.map(h => '<span class="tag plain">'+esc(h)+'</span>').join("")
        + '</div></section>');
    }
    if(it.basis === '問題'){
      p.push('<p class="note">この回は'+esc(kaisetsuLabel)+'が公開されていないため、'
        + '単元・論点・条文は<b>問題文から読み取って</b>整理したものです。</p>');
    }else{
      const srcName = it.combined ? '解説' : kaisetsuLabel;
      p.push('<p class="note">単元・論点・条文は、大学が公開している'+esc(srcName)
        + 'の本文から拾って整理したものです。本文は上のボタンから大学の PDF を開いてください。</p>');
    }
  }else{
    p.push('<p class="note">この回は'+esc(kaisetsuLabel)+'が公開されておらず、問題 PDF も文字情報のない画像のため、'
      + '単元を判定していません。問題は上のボタンから開けます。</p>');
  }

  // PDF プレビュー（埋め込めるものだけ表示し、残りは理由を書く）
  const all = [["mondai", it.combined ? "問題・解説" : "問題"],
               ["kaisetsu", kaisetsuLabel], ["kaitou","解答用紙"]]
    .filter(([k]) => it[k]);
  const tabs = all.filter(([k]) => it.embed[k]);
  if(all.length){
    p.push('<section class="blk"><h4>そのまま読む</h4>');
    if(tabs.length){
      p.push('<div id="tabsPdf" class="chips">'
        + tabs.map(([k,l]) => '<button data-pdf="'+k+'"'+(state.pdf===k?' class="on"':'')+'>'+esc(l)+'</button>').join("")
        + '</div>');
      const cur = tabs.some(([k]) => k === state.pdf) ? state.pdf : tabs[0][0];
      p.push('<iframe id="viewer" src="'+esc(it[cur])+'" title="PDF"></iframe>');
    }
    const blocked = all.filter(([k]) => !it.embed[k]);
    if(blocked.length){
      const reasons = {
        xfo: esc(UNIV_FULL[it.univ]) + 'のサーバーがページ内への埋め込みを許可していないため',
        http: '大学がこの PDF を http（暗号化なし）で公開しており、このページには読み込めないため',
        unreachable: '大学のサーバーに届かなかったため'
      };
      const why = reasons[it.embedWhy[blocked[0][0]]] || '大学側の設定のため';
      p.push('<p class="note">' + blocked.map(([, l]) => esc(l)).join('・')
        + ' はここには表示できません（' + why + '）。上のボタンから新しいタブで開いてください。</p>');
    }
    p.push('</section>');
  }

  box.innerHTML = p.join("");
  const back = document.getElementById("back");
  if(back) back.onclick = () => document.body.classList.remove("open");
  const chk = document.getElementById("doneChk");
  if(chk) chk.onchange = () => {
    if(chk.checked) done[it.id] = 1; else delete done[it.id];
    saveStore(); renderList();
  };
  box.querySelectorAll(".tag[data-u]").forEach(b => b.onclick = () => {
    state.unit = b.dataset.u; state.q = ""; document.getElementById("q").value = "";
    document.body.classList.remove("open");
    saveStore(); renderUnits(); renderList();
  });
  box.querySelectorAll("#tabsPdf button").forEach(b => b.onclick = () => {
    state.pdf = b.dataset.pdf; renderDetail();
  });
}
function aboutHTML(){
  const n = DATA.items.length, c = DATA.items.filter(i => i.classified).length;
  return '<section class="blk about">'
    + '<div class="row"><button class="btn backbtn" id="back">← 一覧</button></div>'
    + '<h2 style="margin-bottom:10px">憲法過去問帳</h2>'
    + '<p>法科大学院が公開している<b>既修者入試（憲法）の過去問</b>を、憲法の単元ごとに引けるようにした索引です。'
    + '左の単元をおすと、その単元が出題された回だけが並びます。</p>'
    + '<h4 style="margin-top:18px">引き方</h4>'
    + '<ul class="topics">'
    + '<li><b>単元から</b> — 左の一覧（裁判所・当事者・訴えの提起・審理・証拠・訴訟の終了・複数請求・上訴・特別手続）</li>'
    + '<li><b>条文から</b> — 上の検索欄に <code>114</code> のように条番号を入れる</li>'
    + '<li><b>論点・判例から</b> — 「既判力」「最判平成3年12月17日」などで検索</li>'
    + '</ul>'
    + '<h4 style="margin-top:18px">収録</h4>'
    + '<p>' + UNIV_LIST.filter(u => DATA.items.some(i => i.univ === u)).map(u =>
        '<a href="'+esc(UNIV_PAGE[u])+'" target="_blank" rel="noopener">'+esc(UNIV_FULL[u])+'</a>').join("・")
    + ' の計 ' + n + ' 回（2005〜2027年度）。うち ' + c + ' 回に単元・論点・条文・判例をつけています。</p>'
    + '<p class="note">立命館は憲法と行政法を合わせた「<b>公法</b>」1冊で出題しています'
    + '（講評に憲法の節があるのは2018〜2021年度）。'
    + '同志社の2016年度後期と同年度の転入学試験は<b>同じ問題・同じ解説</b>です。</p>'
    + '<p class="note">問題・解説の PDF は、このサイトには置いていません。'
    + 'ボタンをおすと各大学の公式ページの PDF をそのまま開きます。'
    + '単元・論点の整理は、大学が公開している解説・入試講評・出題趣旨の本文にもとづく私的なもので、大学の公式見解ではありません。</p>'
    + '</section>';
}
function link(url, label, primary){
  if(!url) return '<span class="btn" aria-disabled="true">'+esc(label)+'</span>';
  return '<a class="btn'+(primary?" primary":"")+'" href="'+esc(url)+'" target="_blank" rel="noopener">'
    + esc(label)+' ↗</a>';
}

/* ---------- 画面上部の絞り込み ---------- */
function renderChips(){
  const u = document.getElementById("univChips");
  u.innerHTML = UNIV_LIST.filter(n => DATA.items.some(i => i.univ === n)).map(n =>
    '<button data-n="'+n+'"'+(state.univ.has(n)?' class="on"':'')+'>'+n+'</button>').join("");
  u.querySelectorAll("button").forEach(b => b.onclick = () => {
    const n = b.dataset.n;
    if(state.univ.has(n)) state.univ.delete(n); else state.univ.add(n);
    saveStore(); renderChips(); renderUnits(); renderList();
  });
}

/* ---------- 起動 ---------- */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function boot(d){
  DATA = d;
  for(const it of DATA.items){
    it.units = it.units || []; it.topics = it.topics || [];
    it.articles = it.articles || []; it.hanrei = it.hanrei || [];
    // 埋め込み可否は tools/fetch_sources.py が実際のヘッダーを見て決め、data に入れてある
    it.embed = it.embed || {};
    it.embedWhy = it.embedWhy || {};
  }
  loadStore();
  if(state.unit && state.unit !== "__uncls__"){
    const keys = new Set();
    for(const g of DATA.taxonomy){ keys.add(g.name); for(const s of g.subs) keys.add(s.key); }
    if(!keys.has(state.unit)) state.unit = null;
  }
  renderChips(); renderUnits(); renderList(); renderDetail();
  document.getElementById("q").oninput = e => {
    state.q = e.target.value; renderList();
  };
  document.getElementById("aboutBtn").onclick = () => {
    state.sel = null; document.body.classList.add("open");
    renderList(); renderDetail(); document.getElementById("detail").scrollTop = 0;
  };
  document.getElementById("navbtn").onclick = () => document.body.classList.toggle("nav");
  document.getElementById("scrim").onclick = () => document.body.classList.remove("nav");
}

const inline = JSON.parse(document.getElementById("kakomon-data").textContent);
if(inline.items && inline.items.length){
  boot(inline);
}else{
  fetch("data/kakomon.json").then(r => r.json()).then(boot).catch(() => {
    document.getElementById("list").innerHTML =
      '<p class="empty">データを読み込めませんでした。<br>'
      + 'リポジトリ直下の <code>開く.command</code> から起動してください。</p>';
  });
}
})();
</script>
